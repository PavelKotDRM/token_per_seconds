[package]
name = "token-per-seconds"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Interactive LLM token generation speed simulator"
license = "Apache-2.0"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "system_fonts", "glow", "x11", "wayland"] }
rfd = "0.18"
tiktoken-rs = "0.12.1"
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
